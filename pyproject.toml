[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-analysis"
version = "0.2.0"
description = "Cost-aware trading backtests, walk-forward evaluation, and European option pricing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["trading_analysis*"]
